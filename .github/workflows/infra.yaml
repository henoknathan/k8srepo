# 1. THE TRIGGER: Defines the name of the pipeline and when it should run.
name: "Terraform Infrastructure Deployment"

on:
  push:
    branches:
      - main # Runs automatically when changes are permanently merged into the main branch.
  pull_request: # Runs safe test-checks when someone proposes changes via a pull request.

# 2. THE PERMISSIONS: Grants this runner permission to safely log into AWS without long-term hardcoded passwords.
permissions:
  id-token: write # Required to authenticate securely with AWS using OpenID Connect (OIDC).
  contents: read  # Allows the runner to read your repository code.
  pull-requests: write # ADDED: Required to automatically comment on pull requests

# 3. GLOBAL WORK DIRECTORY
# FIXED: Directs GitHub to execute all subsequent tasks inside your sub-folder!
defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-latest # Spins up a temporary, fresh Ubuntu Linux cloud machine to run your code.

    steps:
      # Step A: Clones your GitHub repository onto the temporary Linux machine.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # Step B: Authenticates into your AWS account securely using an IAM Role.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Real World Note: Remember to replace this with your actual AWS IAM OIDC Role ARN!
          role-to-assume: arn:aws:iam::514497148354:role/GitHubActionsWorkflowRole
          aws-region: us-east-1 

      # Step C: Downloads and installs the Terraform tool onto the Linux machine.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step D: Connects to your remote backend (S3) to load existing state
      - name: Terraform Init
        run: terraform init
      
      # Step E: Sanity check. Confirms your syntax is correct and free of typos.
      - name: Terraform Validate
        run: terraform validate
      
      # Step F: Simulates the deployment. Saves the exact blueprint blueprint to a file named 'tfplan'.
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        
      # OPTIMIZATION STEP: Publishes the plan logs directly onto your GitHub Pull Request screen!
      - name: Update Pull Request with Plan Output
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan Status: 🚀 Success
            *Pushed by: @${context.actor}*
            
            <details><summary>Show Complete Architecture Plan Output</summary>
            
            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`
            
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
        env:
          PLAN: "terraform-plan-placeholder-output"

      # Step G: The real deployment. It only runs if the code was successfully merged into the main branch.
      - name: Terraform Apply
        # Guardrail: prevents accidental deployments on test branches.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' 
        # FIXED: Removed redundant -auto-approve flag; applying a blueprint file does it natively
        run: terraform apply tfplan 


#The infra.yml file is a GitHub Actions workflow configuration. It acts as your automated deployment pipeline.
#Every time you push code to GitHub, this file instructs GitHub’s cloud servers to automatically set up your 
#AWS credentials, initialize Terraform, plan your cloud infrastructure, and safely deploy it.

