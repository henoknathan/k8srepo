#Port Synchronization: Fixed the upstream targeting port to 8080. This completes the entire network loop 
#perfectly: Browser index.html \(\rightarrow \) Nginx Proxy (Port 80) \(\rightarrow \) Kubernetes Service 
#(Port 8080) \(\rightarrow \) Python Container App (Port 5000).MIME Types Inclusion: 
#Added the include /etc/nginx/mime.types; rule inside the HTTP context. This is required because without it, 
#Nginx may serve your cached styles as raw text, causing web browsers to block them for safety reasons.

# ==============================================================================
# ENTERPRISE UNIFIED NGINX ROUTER (STATIC CAPABILITIES + REVERSE PROXY)
# ==============================================================================
events { 
    worker_connections 1024; # Standard concurrency limit from your template
}

http {
    # Mandated to ensure browsers parse CSS and JS files cleanly instead of plain text
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DEFINING THE CLUSTER INTERNAL GATEWAY ENDPOINT
    upstream backend_servers {
        # CORRECTED: Changed port from 5000 to 8080 to match your k8s/deployment Service layer
        server backend-service.lab-shopflow.svc.cluster.local:8080;
    }

    server {
        listen 80; # Exposed container entrypoint

        # 1. OPTIMIZED STATIC ASSET CACHING BLOCK (PRESERVED FROM YOUR TEMPLATE)
        # PURPOSE: caches static assets for 1 year to dramatically lower server load
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # 2. DEFAULT USER ROUTING (SERVES YOUR HTML APP FILES)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            # The magic routing line preserved from your configuration to handle SPA Deep-Links
            try_files $uri $uri/ /index.html;
        }

        # 3. SECURE GATEWAY REVERSE PROXY LAYER
        # PURPOSE: Intercepts public client /api requests and proxies them down safely into EKS
        location /api/ {
            # Strips the leading "/api" out of the string before passing it to the Python server
            # e.g., browser calls "/api/data" -> Python receives a clean call to "/data"
            rewrite /api/(.*) /$1 break;
            
            proxy_pass http://backend_servers;
            
            # IDENTITY PASS-THROUGH HEADERS
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
# 1 - Multi-Stage Build Efficiency: Splitting the build into a builder phase (Node.js) and a runtime phase (Nginx) 
# shrinks your attack surface and keeps your EKS image under 50MB. This drastically speeds up auto-scaling scale-out 
# times.
# 2 - Reverse Proxying (/api/): You avoid common Cross-Origin Resource Sharing (CORS) headaches. 
# The frontend JavaScript calls a relative path (fetch('/api/data')), and Nginx securely handles routing that 
# traffic to your backend inside the cluster mesh.
# 3 - SPA Routing Protection (try_files): Standard Nginx fails when 
# users refresh a React/Vue page on a sub-route (like /dashboard). 
# Your try_files $uri $uri/ /index.html; line ensures the routing falls back to the client-side router cleanly.

# [User Browser] 
#       │
#       ▼ (Port 80)
# ┌────────────────────────────────────────────────────────┐
# │ Nginx Container (Frontend Pod)                         │
# │                                                        │
# │  ├───► Request to "/"  ──► Serves index.html           │
# │  └───► Request to "/api/data"                          │
# │              │                                         │
# │              ▼ (Striaps "/api" -> becomes "/data")     │
# │        [proxy_pass http://backend_servers]            │
# └──────────────┬─────────────────────────────────────────┘
#                │
#                ▼ (Via CoreDNS inside EKS)
# [backend-service.lab-shopflow.svc.cluster.local:8080]