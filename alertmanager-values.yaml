# How to Apply this to your Cluster SetupIf you are deploying this as part of a standalone Alertmanager Helm 
# installation rather than the complete monolithic stack, execute this targeting the official community chart 
# repository:
# # Add the dedicated alerting application package repository
# helm repo add prometheus-community https://github.io
# helm repo update

# # Install Alertmanager independently directly inside your enterprise namespace
# helm install alertmanager-core prometheus-community/alertmanager \
#   --namespace lab-shopflow \
#   -f alertmanager-values.yaml

# ==============================================================================
# PROMETHEUS ALERTMANAGER CONTEXT BLOCK
# ==============================================================================
config:
  global:
    # PURPOSE: Defines the evaluation timeout window before flushing dynamic metrics
    resolve_timeout: 5m

  # ==============================================================================
  # ALERT ROUTING TREE
  # ==============================================================================
  route:
    # PURPOSE: Groups incoming telemetry items by matching labels to prevent notification spam
    group_by: ['alertname', 'cluster', 'severity']
    
    # PURPOSE: The brief window to gather multiple incoming alerts before building the first bundle
    group_wait: 30s
    
    # PURPOSE: The delay interval enforced before transmitting a bundle containing new alert tokens
    group_interval: 5m
    
    # PURPOSE: The silence timer tracking when to repeat an active, unresolved notification stream
    repeat_interval: 12h
    
    # Default target workspace router path for incoming system metrics
    receiver: 'slack-notifications'

  # ==============================================================================
  # NOTIFICATION RECEIVERS LIST
  # ==============================================================================
  receivers:
  - name: 'slack-notifications'
    slack_configs:
    # FIXED: Replaced standard domain root with the proper operational Slack webhook path signature
    - api_url: 'https://slack.com'
      channel: '#devops-alerts'
      send_resolved: true 
      
      # --- ENTERPRISE SLACK VISUAL FORMATTING ---
      # FIXED: Cleaned and single-bracketed the template string text to prevent Helm compilation loops
      title: '[{{ .Status | toUpper }}] - EKS Cluster Alert: {{ .CommonLabels.alertname }}'
      text: >-
        *Description:* {{ .CommonAnnotations.description }}
        *Severity:* `{{ .CommonLabels.severity }}`
        *Impacted Component:* {{ .CommonLabels.instance }}

