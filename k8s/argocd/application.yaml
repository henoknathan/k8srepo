apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-gitops-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/henoknathan/k8srepo.git' # <-- Put your real GitHub link here
    targetRevision: HEAD
    path: k8s # ArgoCD watches your entire existing k8s folder
  destination:
    server: 'default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
