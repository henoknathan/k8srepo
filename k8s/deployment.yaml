# ==============================================================================
# SECTION 0: NAMESPACE CREATION
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-shopflow

---
# ==============================================================================
# SECTION 1: GLOBAL ENTERPRISE STORAGE INFRASTRUCTURE
# ==============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
# FIXED: Replaced invalid string with official Amazon EFS CSI Driver identifier
provisioner: efs.csi.aws.com
volumeBindingMode: Immediate
parameters:
  provisioningMode: efs-ap
  fileSystemId: "REPLACE_WITH_YOUR_TERRAFORM_EFS_ID" 
  directoryPerms: "700"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-efs-pvc
  namespace: lab-shopflow # FIXED: Moved to lab-shopflow namespace
spec:
  accessModes:
    - ReadWriteMany 
  storageClassName: efs-sc
  resources:
    requests:
      storage: 10Gi 

# ==============================================================================
# SECTION 2: FRONTEND MICROSERVICE DEPLOYMENT & NETWORK EXPOSURE
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow-frontend
  namespace: lab-shopflow # FIXED: Moved to lab-shopflow namespace
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web-container
          image: REPLACE_WITH_YOUR_ECR_FRONTEND_URL:build-latest 
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          # ADDED: Connects EFS to Frontend for shared media uploads as designed
          volumeMounts:
            - name: efs-assets
              mountPath: /usr/share/nginx/html/uploads
      volumes:
        - name: efs-assets
          persistentVolumeClaim:
            claimName: shared-efs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: shopflow-frontend-svc
  namespace: lab-shopflow # FIXED: Moved to lab-shopflow namespace
spec:
  type: ClusterIP 
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: frontend

# ==============================================================================
# SECTION 3: BACKEND API DEPLOYMENT & PERSISTENT STORAGE
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow-backend
  namespace: lab-shopflow # FIXED: Moved to lab-shopflow namespace
  labels:
    app: backend
    tier: api
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: api-container
          image: REPLACE_WITH_YOUR_ECR_BACKEND_URL:build-latest
          ports:
            - containerPort: 8080 # Matches your updated Flask target port
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data-storage-volume
              mountPath: /var/www/uploads 
      volumes:
        - name: data-storage-volume
          persistentVolumeClaim:
            claimName: shared-efs-pvc 

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service # FIXED: Renamed to match the exact string inside Nginx CoreDNS configuration
  namespace: lab-shopflow # FIXED: Moved to lab-shopflow namespace
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: backend

# ==============================================================================
# SECTION 4: ENTERPRISE NETWORK INGRESS CONFIGURATION (AWS ALB ROUTING)
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopflow-ingress
  namespace: lab-shopflow # FIXED: Moved to lab-shopflow namespace
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:514497148354:certificate/YOUR-ACM-GUID-HERE"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb 
  rules:
    - http:
        paths:
          # FIXED: Cleaned up rules. Public users hit / which routes to Nginx. 
          # Nginx handles rendering web pages AND securely reverse-proxies /api traffic internally.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopflow-frontend-svc
                port:
                  number: 80
