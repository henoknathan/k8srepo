apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-autoscaler
  namespace: lab-shopflow             
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopflow-backend            # FIXED: Targets your exact backend deployment name
  minReplicas: 2
  maxReplicas: 10
  metrics:
  # Metric 1: CPU Utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60       
  # ADDED Metric 2: Memory Safeguard against Python concurrency memory bloat
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75        # Triggers a scale up if memory consumption hits 75%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0   
      policies:
      - type: Percent
        value: 100                    
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300 
      policies:
      - type: Percent                 
        value: 10                     
        periodSeconds: 60

---
# ==============================================================================
# 2. FRONTEND AUTO-SCALING (The HPA Pattern with Anti-Flapping Behavior)
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-autoscaler
  namespace: lab-shopflow             
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopflow-frontend           # FIXED: Targets your exact frontend deployment name
  minReplicas: 2
  maxReplicas: 5
  metrics:
  # Metric 1: CPU Utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70       
  # ADDED Metric 2: Memory Safeguard for Nginx connections
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80        
  behavior: 
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300 
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

