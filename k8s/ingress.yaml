apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-tier-ingress
  annotations:
    # REMOVED: AWS ALB specific annotations
    # ADDED: Nginx configuration to cleanly handle the routing paths
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  # CHANGED: Switch from 'alb' to the standard local free ingress controller
  ingressClassName: nginx 
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
              

