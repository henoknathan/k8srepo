# ==============================================================================
# ENTERPRISE RECONCILIATION LOOP: PERSISTENT STORAGE CLAIMS VERIFICATION
# ==============================================================================
# COMMAND PURPOSE: 
# - Queries the active 'monitoring' namespace inside the EKS cluster.
# - Validates that the cloud infrastructure has successfully carved out storage.
#
# EXPECTED STACK VERIFICATION RESULTS:
# - Look for the status column showing 'Bound' for all requested claims.
# - You should see your two distinct volume templates:
#   1. A 50Gi claim allocated for the Prometheus time-series database (TSDB).
#   2. A 10Gi claim allocated for your Grafana custom dashboard memory files.
# ==============================================================================

#kubectl get pvc -n monitoring

# ==============================================================================
# ENTERPRISE ROUTING FIREWALL WORKLOG & AUDIT MANIFEST (ingress.yaml)
# ==============================================================================
# ARCHITECTURAL CHANGES IMPLEMENTED & REASONING:
#
# 1. ADDED SECURE INFRASTRUCTURE ROUTING RULES:
#    - The three newly introduced SSL annotations (certificate-arn, listen-ports, 
#      and ssl-redirect) instruct the AWS Load Balancer Controller to dynamically 
#      provision secure port 443 entry points directly on your active AWS network.
#
# 2. PRESERVED PROACTIVE HEALTH CHECK BLOCKS:
#    - The dedicated '/health' monitoring configuration is kept completely intact. 
#      The AWS cloud infrastructure will query this specific app routing path every 
#      15 seconds, automatically isolating broken pods before public users see them.
#
# 3. RESOLVED INTERNAL PORT SYNCHRONIZATION BUG:
#    - Changed the target routing network point from port 5000 to port 8080. 
#      If left at 5000, the physical AWS Load Balancer would forward encrypted 
#      user traffic to an inactive port, causing immediate '502 Bad Gateway' crashes.
#
# 4. IMPLEMENTED SECURE REVENUE & OPERATIONS ROUTING SPLIT (/grafana):
#    - Expanded the network boundary rules array to include the internal monitoring service.
#      External operations traffic hitting your domain's sub-path is automatically caught 
#      at the SSL termination edge and proxies safely down to Grafana port 80.
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-tier-ingress
  namespace: lab-shopflow
  annotations:
    # --- Baseline AWS Settings ---
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: enterprise-alb
    
    # --- SSL/TLS & HTTPS Configuration ---
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:514497148354:certificate/YOUR-ACM-GUID-HERE"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    
    # --- MODERN HTTPS REDIRECT ACTION ---
    # Configures the ALB to automatically route all HTTP (Port 80) traffic over to HTTPS (Port 443)
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    
    # --- GLOBAL HEALTH CHECK DEFAULTS ---
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/success-codes: '200'

    # --- FIX: INDEPENDENT TARGET GROUP HEALTH CHECK OVERRIDES ---
    # Maps tailored health paths directly to each service's specific endpoint backend
    alb.ingress.kubernetes.io/target-group-attributes: |
      healthcheck.path.frontend-service=/index.html,
      healthcheck.path.backend-service=/health,
      healthcheck.path.monitor-stack-grafana=/api/health
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      # 1. Enforce SSL Redirect rule at the very top of the entry logic
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ssl-redirect
            port:
              name: use-annotation

      # 2. Grafana Monitoring Interface
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: monitor-stack-grafana 
            port:
              number: 80

      # 3. Backend API Service Route
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080 

      # 4. Catch-All Frontend Web Traffic Route
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80



