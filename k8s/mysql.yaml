# If a Senior DevOps Engineer looks at this manifest they will immediately point out these two 
# flaws:Deployments vs. StatefulSets: You are using a Deployment for a database. If your database pod is updated 
# or rescheduled, a Deployment might start the new pod before killing the old one. Because databases lock files, 
# this causes data corruption or mounting failures. For databases, you should always use a StatefulSet because it 
# guarantees strict ordering and unique pod identities.The EFS Permission Trap: MySQL expects its storage folder 
# (/var/lib/mysql) to be owned by the mysql user (UID 999). When you mount a raw AWS EFS volume, it is natively 
# owned by root (UID 0). MySQL will fail to start with a Permission denied error. You must use an initContainer to 
# automatically change the folder permissions (chown) before the database boots up.
