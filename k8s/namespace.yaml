# ==============================================================================
# ENTERPRISE LOGICAL BOUNDARY INITIALIZATION MANIFEST (k8s/namespace.yaml)
# ==============================================================================
# PURPOSE & LOGIC:
# - Creates an isolated virtual workspace environment partition named 'lab-shopflow'.
# - Provides a secure perimeter for your entire enterprise application stack.
# - Ensures your services, storage claims, deployments, secrets, and network policies 
#   can interact seamlessly via shortcode DNS names while remaining completely hidden 
#   from other system processes running on the host cluster.
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: lab-shopflow            # CRITICAL: The exact workspace key referenced by your entire manifest stack
  labels:
    environment: production     # Tagging metadata for administrative classification and tracking
    project: shopflow           # Enables automated monitoring tools to slice metric reports by project
