# ==============================================================================
# 1. FRONTEND NETWORK POLICY (Internet Traffic Entry Point)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: lab-shopflow
spec:
  podSelector:
    matchLabels:
      app: frontend             # Secures your Nginx web client containers
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0         # Allows public internet and AWS Load Balancers to reach the UI
    ports:
    - protocol: TCP
      port: 80                  # Matches your Nginx web protocol port
---
# ==============================================================================
# 2. BACKEND NETWORK POLICY (Isolated App Tier)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: lab-shopflow
spec:
  podSelector:
    matchLabels:
      app: backend              # Secures your Python/Flask API containers
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend         # Strictly blocks direct external access; traffic must pass through the UI proxy
    ports:
    - protocol: TCP
      # FIXED PORT: Changed from 5000 to 8080 to match your updated Gunicorn production layer
      port: 8080                
---
# ==============================================================================
# 3. DATABASE NETWORK POLICY (Deep Isolation Core)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-policy
  namespace: lab-shopflow
spec:
  podSelector:
    matchLabels:
      app: mysql                # Secures your MySQL deployment engine pods
  policyTypes:
  - Ingress
  ingress:
  - from:
    # PERMISSION PATH A: The persistent API application servers
    - podSelector:
        matchLabels:
          app: backend
          
    # PERMISSION PATH B: Dynamic Jenkins DB Migration Engine Job
    # FIXED: Grouped safely under standard pod selector arrays to enforce strict least-privilege
    - podSelector:
        matchExpressions:
          - key: job-name
            operator: Exists    # Authorizes your dynamic schema jobs securely
    ports:
    - protocol: TCP
      port: 3306                # Standard database interface socket engine port


