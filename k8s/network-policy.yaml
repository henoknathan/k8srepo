#The Migration Job Block Failure: In Stage 7 of your Jenkinsfile, you configured an isolated Kubernetes 
#database migration engine (job/shopflow-db-migration-${BUILD_NUMBER}). This job runs a standalone pod 
#with a custom label (typically matching job-name). Because your database-policy strictly blocks everything 
#except app: backend, your database migrations will be blocked and time out. 
#e must update the policy to explicitly allow the migration job pods to pass through the database firewall.
#The Frontend Egress/Ingress Rule: Your frontend uses Nginx as a reverse proxy, making calls directly to the 
#backend. Because your backend-policy permits traffic coming from app: frontend on port 5000, 
#it aligns perfectly with your Flask container mapping.

# ==============================================================================
# KEY ARCHITECTURAL UPDATES & MAINTENANCE DOCUMENTATION
# ==============================================================================

# 1. THE DYNAMIC MIGRATION ACCESS GATEWAY:
#    - Rule added: 'matchExpressions: ... operator: Exists' inside the database policy.
#    - Purpose: Since your database migration jobs change their tracking name on every run
#      (e.g., shopflow-db-migration-42), a standard static label lookup will fail.
#    - Functionality: Instructing Kubernetes to look for the presence of the system-injected
#      'job-name' key allows any legitimate cluster job pod to securely connect and apply
#      schema modifications without breaking your strict database firewall rules.
#
# 2. WHERE DOES THIS FILE GO?
#    - Repository Storage Path: Save this combined layout as 'k8s/network-policy.yaml'.
#    - Pipeline Execution Connection: The unified deployment step 'kubectl apply -f k8s/' in
#      Stage 8 of your master Jenkinsfile will automatically catch, process, and activate
#      these security parameters on your EKS cluster nodes concurrently.
#
# ==============================================================================

# ==============================================================================
# 1. FRONTEND NETWORK POLICY (Internet Traffic Entry Point)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: lab-shopflow
spec:
  podSelector:
    matchLabels:
      app: frontend             # Secures your Nginx web client containers
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0         # Allows public internet and AWS Load Balancers to reach the UI
    ports:
    - protocol: TCP
      port: 80                  # Matches your Nginx web protocol port
---
# ==============================================================================
# 2. BACKEND NETWORK POLICY (Isolated App Tier)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: lab-shopflow
spec:
  podSelector:
    matchLabels:
      app: backend              # Secures your Python/Flask API containers
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend         # Strictly blocks direct external access; traffic must pass through the UI proxy
    ports:
    - protocol: TCP
      port: 5000                # Matches your Flask application network listening containerPort
---
# ==============================================================================
# 3. DATABASE NETWORK POLICY (Deep Isolation Core)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-policy
  namespace: lab-shopflow
spec:
  podSelector:
    matchLabels:
      app: mysql                # Secures your MySQL deployment engine pods
  policyTypes:
  - Ingress
  ingress:
  - from:
    # PERMISSION PATH A: The persistent API application servers
    - podSelector:
        matchLabels:
          app: backend
          
    # PERMISSION PATH B (CRITICAL UPDATE): Dynamic Jenkins DB Migration Engine Job
    # PURPOSE: Allows the short-lived database update jobs to safely communicate with MySQL
    - podSelector:
        matchExpressions:
          - key: job-name
            operator: Exists    # Natively detects and authorizes any Kubernetes Job pod running in this space
    ports:
    - protocol: TCP
      port: 3306                # Standard database interface socket engine port

