# Why This Architecture Works PerfectlyPorts Match Up Exactly: 
# 1 - Ports Match Up Exactly: Your backend-service listens on port 8080, which perfectly satisfies the upstream string you defined in your Nginx configuration (backend-service.lab-shopflow.svc.cluster.local:8080).
# 2 - Proper Isolation Boundaries: Both the backend and database services are marked as ClusterIP. They have no public IP addresses, protecting your business logic and storage data from direct internet attacks.
# 3 - Target Port Bridging: Your backend service accepts traffic on port 8080 but safely maps it down to targetPort: 5000, matching standard configurations for Python Flask/FastAPI containers.

# "Using type: LoadBalancer directly on a Kubernetes Service is a great way to quickly expose an application during
# a proof-of-concept, but it presents major architectural and cost inefficiencies in a production enterprise scale-out.
# By default in AWS, this triggers the legacy Cloud Provider to spin up an individual Classic Load Balancer (CLB) or a 
# Network Load Balancer (NLB). If our infrastructure grows to have 10 different frontend applications or microservices 
# exposed to the internet, this approach forces AWS to provision 10 individual load balancers, resulting in high unnecessary 
# costs and fragmented DNS management.To solve this in a production-ready AWS landing zone, I would change the service type 
# to ClusterIP and deploy the AWS Load Balancer Controller to manage traffic via a centralized Kubernetes Ingress 
# object."

# [Internet Traffic]
#         │
#         ▼ (Single AWS Application Load Balancer - ALB)
# ┌─────────────────┐
# │  AWS Ingress    │ (App Routing Rules / SSL Termination)
# └────────┬────────┘
#          │
#          ├──► /        ──► [frontend-service (ClusterIP)] ──► Nginx Pods
#          └──► /api     ──► [backend-service (ClusterIP)]  ──► Flask/FastAPI Pods

# "An Ingress workflow provides three massive operational advantages:
# 1 - Cost Consolidation: A single AWS Application Load Balancer 
# (ALB) can intelligently route traffic to dozens of different cluster backend services using path-based (/api) or 
# host-based (://domain.com) routing rules.

# 2 - Native AWS Integration: The AWS Load Balancer Controller provisions native 
# ALBs that route traffic directly to pod IP addresses using standard AWS VPC CNI features, completely bypassing 
# extra Kubernetes routing hops (NodePorts).

# 3 - Advanced Security: It allows us to easily bind AWS Certificate Manager (ACM) 
# SSL certificates and attach AWS WAF (Web Application Firewall) policies directly to our cluster entrypoint using 
# standard Kubernetes annotations."You now have a complete, cohesive picture of the database storage, secret handling, 
# multi-stage application delivery, and networking layer for this stack.