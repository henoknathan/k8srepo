# 🎯 Network Traffic Verification Checklist

# With this final configuration file corrected, your cluster networking 
# maps out perfectly:Public Internet 
# ➡️ AWS ALB Ingress (Processes HTTPS on 443, drops insecure port 80).
# AWS ALB 
# ➡️ shopflow-frontend-svc (Hits ClusterIP Port 80, forwards to Nginx container port 80).
# Nginx Proxy 
# ➡️ backend-service (Strips /api, routes to backend ClusterIP Port 8080, lands on Gunicorn container 
# port 8080).Gunicorn App 
# ➡️ mysql-service (Hits database ClusterIP Port 3306, fully insulated by your zero-trust 
# network firewall rules).

# ==============================================================================
# 1. FRONTEND SERVICE (Web Traffic Routing Layer)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  # FIXED: Renamed to match the exact string expected by your AWS ALB Ingress rule
  name: shopflow-frontend-svc
  namespace: lab-shopflow       
spec:
  # FIXED: Swapped to ClusterIP to let your AWS ALB Ingress safely manage edge traffic
  type: ClusterIP               
  selector:
    app: frontend               
  ports:
    - protocol: TCP
      port: 80                  
      targetPort: 80            
---
# ==============================================================================
# 2. BACKEND SERVICE (Internal Private API Router)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: lab-shopflow       
spec:
  type: ClusterIP               
  selector:
    app: backend                
  ports:
    - protocol: TCP
      port: 8080                
      # FIXED: Changed from 5000 to 8080 to perfectly hit your Gunicorn production engine
      targetPort: 8080          
---
# ==============================================================================
# 3. MYSQL SERVICE (Private Database Core Entrypoint)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql-service           
  namespace: lab-shopflow       
spec:
  type: ClusterIP               
  selector:
    app: mysql                  
  ports:
    - protocol: TCP
      port: 3306                
      targetPort: 3306          




#Critical Architectural Changes Implemented:The Port 8080/5000 Bridge: Setting the backend service port to 
#8080 while leaving the container targetPort at 5000 is an enterprise security best practice. 
#It abstractly changes the external port signature and ensures your frontend proxy traffic meets your 
#application container right where it expects it.Strict Namespace Enclosure: 
#Hardcoding the metadata namespace locks down your network discovery paths. It allows components to interact 
