# ==============================================================================
# AWS EFS STORAGE LAYER ATTACHMENT MANIFEST (k8s/storage.yaml)
# ==============================================================================
# PURPOSE & LOGIC:
# - By explicitly declaring 'namespace: lab-shopflow', it matches your secret, 
#   deployment, and database namespaces exactly.
# - This parameter guarantees that your MySQL pod engine will find, authenticate, and 
#   mount the underlying AWS Elastic File System (EFS) storage drive upon initialization.
# - This configuration safeguards your database records against loss if a pod restarts.
# ==============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-claim
  namespace: lab-shopflow       # CRITICAL: Bound to your secure workspace to connect with the MySQL engine pod
spec:
  accessModes:
    - ReadWriteMany             # Allows multiple database replicas or application layers to read/write concurrently if scaled
  storageClassName: efs-sc      # Direct target mapping connecting to your provisioned AWS EFS StorageClass provisioner
  resources:
    requests:
      storage: 5Gi              # Dynamically allocates 5 Gigabytes of persistent storage space for your database schemas

