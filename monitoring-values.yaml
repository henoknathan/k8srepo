# ==============================================================================
# ENTERPRISE OBSERVABILITY OBSERVABILITY STACK DEPLOYMENT SCRIPT
# ==============================================================================
# PURPOSE: 
# 1. Downloads the certified Prometheus, Alertmanager, and Grafana engine binaries.
# 2. provisions an isolated tracking perimeter (Namespace) inside the EKS cluster.
# 3. Mounts customized notification routing filters and Grafana user dashboards.
# ==============================================================================

# --- STEP 1: DOWNLOAD CERTIFIED OBSERVAIBILITY ENGINES ---
# PURPOSE: Registers the Prometheus-Community repository with your local Helm execution layer.
# TECHNICAL NOTE: Updates your local index ledger to catch recent platform stability hotfixes.
#helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#helm repo update

# --- STEP 2: PROVISION MONITORING WORKLOADS MESH ---
# PURPOSE: Spins up Prometheus, Alertmanager, and Grafana simultaneously into their own namespace.
