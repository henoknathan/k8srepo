# endpoints, configure quiet intervals, and activate native Grafana-to-Alertmanager dashboard proxying.
#helm install monitor-stack prometheus-community/kube-prometheus-stack \
#  --namespace monitoring \
#  --create-namespace \
#  -f monitoring-values.yaml
#Verification and Post-Deployment CheckTo confirm that your unified monitoring suite successfully booted up 
