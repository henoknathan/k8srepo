# Checks the status of all metrics collection engines, dashboards, and routers
#kubectl get pods -n monitoring

# ------------------------------------------------------------------------------
# SECTION 1: ALERTMANAGER CORE ENGINE & ROUTING
# ------------------------------------------------------------------------------
# ==============================================================================
# ENTERPRISE PROMETHEUS, ALERTMANAGER, & GRAFANA VALUES CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# SECTION 1: ALERTMANAGER CORE ENGINE & ROUTING
# ------------------------------------------------------------------------------
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - api_url: 'https://slack.com'
        channel: '#devops-alerts'
        send_resolved: true
        title: '[[{{ .Status | toUpper }}]] - EKS Cluster Alert: {{ .CommonLabels.alertname }}'
        text: >-
          *Description:* {{ .CommonAnnotations.description }}
          *Severity:* `{{ .CommonLabels.severity }}`
          *Impacted Component:* {{ .CommonLabels.instance }}

# ------------------------------------------------------------------------------
# SECTION 2: PROMETHEUS PERSISTENT CORE DATABASE (TSDB)
# ------------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # PURPOSE: Ensures metric retention lasts long enough for corporate historical audit needs
    retention: 30d
    
    # --- PROMETHEUS STORAGE STATE AUTOMATION ---
    # PURPOSE: Replaces ephemeral storage with an immutable AWS EFS network drive allocation.
    storageSpec:
      volumeClaimTemplate:
        spec:
          # References the automated EFS driver StorageClass provisioned via your Terraform main.tf
          storageClassName: efs-sc 
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 50Gi # Allocates baseline storage block space for cluster time-series tracking data

# ------------------------------------------------------------------------------
# SECTION 3: GRAFANA INTERFACE & PERSISTENT DASHBOARDS
# ------------------------------------------------------------------------------
grafana:
  enabled: true
  adminPassword: "EnterpriseSecurePassword2026"
  
  # --- GRAFANA STORAGE CONFIGURATION ---
  # PURPOSE: Preserves custom dashboards, login records, and plugin states across lifecycle updates.
  persistence:
    enabled: true
    storageClassName: efs-sc
    accessModes:
      - ReadWriteMany
    size: 10Gi
    
  # --- GRAPH ENGINE AUTOMATION ---
  # PURPOSE: Configures Grafana to automatically detect and integrate your Alertmanager metrics 
  # so you can visualize and silence alerts inside the Grafana UI.
  additionalDataSources:
    - name: Alertmanager
      type: alertmanager
      access: proxy
      # Internal Kubernetes service DNS string pointing to your cluster Alertmanager instance
      url: http://localhost:9093 
      jsonData:
        implementation: prometheus  # Tells Grafana this is a native Prometheus Alertmanager API backend
        handleGrafanaManagedAlerts: true  # Connects Grafana alerts to the Alertmanager pipeline
