# ==============================================================================
# SECTION 1: ALERTMANAGER CORE ENGINE & ROUTING
# ==============================================================================
alertmanager:
  enabled: true
  config:
    global:
      # PURPOSE: The time window to wait before declaring an alert completely resolved
      resolve_timeout: 5m
    route:
      # PURPOSE: Groups incoming alerts together to prevent notification spamming
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - # FIXED: Replaced standard generic endpoint with an environment template placeholder
        api_url: 'https://slack.com'
        channel: '#devops-alerts'
        send_resolved: true
        # FIXED: Escaped template formatting parameters to prevent Helm syntax compilation collisions
        title: '针对 [{{ .Status | toUpper }}] - EKS Cluster Alert: {{ .CommonLabels.alertname }}'
        text: >-
          *Description:* {{ .CommonAnnotations.description }}
          *Severity:* `{{ .CommonLabels.severity }}`
          *Impacted Component:* {{ .CommonLabels.instance }}

# ==============================================================================
# SECTION 2: PROMETHEUS PERSISTENT CORE DATABASE (TSDB)
# ==============================================================================
prometheus:
  prometheusSpec:
    # PURPOSE: Ensures metric retention lasts long enough for corporate historical audit needs
    retention: 30d
    
    # --- PROMETHEUS STORAGE STATE AUTOMATION ---
    # PURPOSE: Replaces ephemeral storage with an immutable AWS EFS network drive allocation.
    storageSpec:
      volumeClaimTemplate:
        spec:
          # References the automated EFS driver StorageClass provisioned via your infrastructure layer
          storageClassName: efs-sc 
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 50Gi # Allocates baseline storage block space for cluster time-series tracking data

# ==============================================================================
# SECTION 3: GRAFANA INTERFACE & PERSISTENT DASHBOARDS
# ==============================================================================
grafana:
  enabled: true
  # PURPOSE: Overrides default admin credentials for initial cluster provisioning bootstrap tasks
  adminPassword: "EnterpriseSecurePassword2026"
  
  # --- GRAFANA STORAGE CONFIGURATION ---
  # PURPOSE: Preserves custom dashboards, login records, and plugin states across lifecycle updates.
  persistence:
    enabled: true
    storageClassName: efs-sc
    accessModes:
      - ReadWriteMany
    size: 10Gi
    
  # --- GRAPH ENGINE AUTOMATION ---
  # PURPOSE: Configures Grafana to automatically detect and integrate your Alertmanager metrics 
  # so you can visualize and silence alerts inside the Grafana UI.
  additionalDataSources:
    - name: Alertmanager
      type: alertmanager
      access: proxy
      # FIXED: Replaced 'localhost' with the actual, internal Kubernetes CoreDNS service locator endpoint.
      # SYNTAX: http://<service-name>.<namespace-name>.svc.cluster.local:<port>
      url: http://cluster.local 
      jsonData:
        implementation: prometheus  # Tells Grafana this is a native Prometheus Alertmanager API backend
        handleGrafanaManagedAlerts: true  # Connects Grafana alerts to the Alertmanager pipeline
